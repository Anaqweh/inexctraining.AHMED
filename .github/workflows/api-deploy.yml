# نشر الـAPI أولًا بأول: عند أي تغيير في inexc-api/ على master تُبنى صورة Docker وتُدفع إلى GHCR ثم يُستدعى Deploy Hook في Render.
# المتطلبات: سر RENDER_DEPLOY_HOOK في إعدادات المستودع، وخدمة Render تسحب الصورة ghcr.io/anaqweh/inexc-api:latest.
name: api-deploy
on:
  push:
    branches: [master]
    paths: ['inexc-api/**', '.github/workflows/api-deploy.yml']
  workflow_dispatch:
concurrency: { group: api-deploy, cancel-in-progress: false }
permissions: { contents: read, packages: write }
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فحص صياغة الخادم
        run: cd inexc-api && node --check server.js && node --check course-wall.js
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: بناء الصورة ودفعها
        uses: docker/build-push-action@v6
        with:
          context: inexc-api
          push: true
          tags: |
            ghcr.io/anaqweh/inexc-api:latest
            ghcr.io/anaqweh/inexc-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: استدعاء Deploy Hook في Render
        env: { HOOK: '${{ secrets.RENDER_DEPLOY_HOOK }}' }
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::الصورة دُفعت إلى GHCR لكن سر RENDER_DEPLOY_HOOK غير موجود؛ انشر يدويًا من Render."; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null && echo "طُلب النشر من Render"
